
{% extends "base.html" %}

{% block title %}Login | VRIKHSHAM{% endblock %}

{% block content %}

<style>
.login-section {
    min-height: 75vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
    background: #f3f8f1;
}

.login-card {
    width: 100%;
    max-width: 450px;
    background: white;
    padding: 40px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.login-card h1 {
    text-align: center;
    color: #245c36;
    margin-bottom: 10px;
}

.login-subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

.login-form label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #344b38;
}

.login-form input {
    width: 100%;
    padding: 13px;
    margin-bottom: 20px;
    border: 1px solid #d5dfd3;
    border-radius: 8px;
    box-sizing: border-box;
}

.login-form input:focus {
    outline: none;
    border-color: #32834b;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #267a43;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.login-btn:hover {
    background: #155b31;
}

.login-message {
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 8px;
    text-align: center;
}

.login-error {
    background: #fff0f0;
    color: #c62828;
}

.login-register {
    text-align: center;
    margin-top: 22px;
}

.login-register a {
    color: #267a43;
    text-decoration: none;
    font-weight: 600;
}
</style>

<section class="login-section">
    <div class="login-card">

        <h1>Welcome Back 🌿</h1>

        <p class="login-subtitle">
            Login to continue your VRIKHSHAM journey.
        </p>

        {% if error %}
            <div class="login-message login-error">
                {{ error }}
            </div>
        {% endif %}

        <form class="login-form"
              method="POST"
              action="{{ url_for('auth.login') }}">

            <!-- Preserve the originally requested page -->
            <input type="hidden"
                   name="next"
                   value="{{ request.args.get('next', '') }}">

            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="current-password"
                       required>
                <button type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                        title="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="login-register">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Register</a>
        </p>

    </div>
</section>

{% endblock %}
